<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tales of Hearthvale</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="login" class="panel">
      <h1>Tales of Hearthvale</h1>
      <p class="sub">ผู้ผูกด้ายแห่งหมู่บ้านบรินเดิล</p>
      <form id="login-form" autocomplete="off">
        <label for="name">ชื่อตัวละคร</label>
        <input id="name" maxlength="16" placeholder="เช่น Ploy" required />
        <label for="password">รหัสผ่าน</label>
        <input id="password" type="password" maxlength="64" placeholder="อย่างน้อย 4 ตัว" required autocomplete="current-password" />
        <label>สีเสื้อ <span class="hint">(ใช้ตอนสร้างตัวละครใหม่)</span></label>
        <div id="colors"></div>
        <button type="submit" id="enter">เข้าสู่โลก</button>
        <button type="button" id="create" class="secondary">สร้างตัวละครใหม่</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </div>

    <div id="hud" class="panel" hidden>
      <div class="hud-top">
        <span id="hud-name"></span>
        <span id="hud-level"></span>
      </div>
      <div id="hud-job"></div>
      <div class="bar hp"><div id="hp-fill"></div><span id="hp-text"></span></div>
      <div class="bar exp"><div id="exp-fill"></div><span id="exp-text"></span></div>
      <div id="hud-gold"></div>
      <div id="hud-meta"><span id="map-name"></span> · <span id="online"></span></div>
    </div>

    <button id="tree-open" hidden>ต้นไม้พาสซีฟ (P)<span id="tree-badge" hidden></span></button>

    <div id="tree" class="panel" role="dialog" aria-label="ต้นไม้พาสซีฟ" hidden>
      <div class="tree-head">
        <h2>ผืนทอแห่งชะตา</h2>
        <span id="tree-points"></span>
        <span id="tree-gold"></span>
        <button id="tree-centre">ดูทั้งผืน</button>
        <button id="tree-close" aria-label="ปิด">✕</button>
      </div>
      <div class="tree-body">
        <div id="tree-canvas">
          <svg><g id="tree-nodes"></g></svg>
          <div id="tree-tip" hidden></div>
        </div>
        <div id="tree-side">
          <div id="tree-selected"></div>
          <h3>โบนัสรวม</h3>
          <div id="tree-total"></div>
          <h3>ค่าพลัง</h3>
          <div id="tree-help"></div>
        </div>
      </div>
    </div>

    <div id="skillbar" hidden>
      <button id="job-change" hidden>เปลี่ยนอาชีพเป็นสไควร์</button>
      <div id="skill-points"></div>
      <div id="skills"></div>
    </div>

    <div id="death" hidden>
      <div class="panel death-box">
        <h2>คุณหมดสติ</h2>
        <p>ฟื้นขึ้นที่ลานกลางหมู่บ้าน</p>
        <button id="respawn" disabled>ฟื้นคืนชีพ</button>
      </div>
    </div>

    <div id="chat" hidden>
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" maxlength="120" placeholder="กด Enter เพื่อพิมพ์" />
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
